name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [simulator, server, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use npm 11
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace ${{ matrix.workspace }}

      - name: Type-check
        run: npm run typecheck --workspace ${{ matrix.workspace }}

      - name: Test
        run: npm run test --workspace ${{ matrix.workspace }}

      - name: Build
        run: npm run build --workspace ${{ matrix.workspace }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use npm 11
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  browser-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm run test:startup
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
