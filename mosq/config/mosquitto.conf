# Minimal Mosquitto config for local development / demo purposes only.
# Anonymous access is intentionally allowed with no TLS - this broker is not
# exposed outside the docker-compose network. Do not deploy this config as-is
# to anything internet-facing; see README "Security notes" for what a real
# deployment would need instead (auth, TLS, ACLs).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
