services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    depends_on:
      - mosquitto
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: lora
      NODE_COUNT: ${NODE_COUNT:-6}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-4000}
      ALERT_MODE: ${ALERT_MODE:-random}
      ALERT_PROBABILITY: ${ALERT_PROBABILITY:-0.35}
    restart: unless-stopped

  server:
    build:
      context: ./server
    depends_on:
      - mosquitto
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: lora
      DB_PATH: /app/data/dashboard.sqlite
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - '5173:4173'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mosquitto-data:
  server-data:
